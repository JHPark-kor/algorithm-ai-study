name: Sync Notion paper reviews

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "정리할 알고리즘 폴더 이름"
        required: true
        default: "svm"
      week:
        description: "주차 이름"
        required: true
        default: "w7"
      notion_pages:
        description: "처리할 Notion 카드 URL/ID 목록. 여러 개는 쉼표 또는 줄바꿈으로 구분"
        required: false
        default: ""
      notion_source_id:
        description: "선택: Notion 데이터소스/데이터베이스 ID. 비워두면 notion_pages만 사용"
        required: false
        default: ""
      target_branch:
        description: "PR 대상 브랜치"
        required: true
        default: "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PDF text extraction helper
        run: python -m pip install --upgrade pypdf

      - name: Sync Notion reviews
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          NOTION_SOURCE_ID: ${{ inputs.notion_source_id }}
          NOTION_PAGES: ${{ inputs.notion_pages }}
          STUDY_ALGORITHM: ${{ inputs.algorithm }}
          STUDY_WEEK: ${{ inputs.week }}
        run: |
          python scripts/sync_notion_to_github.py \
            --algorithm "${{ inputs.algorithm }}" \
            --week "${{ inputs.week }}" \
            --notion-pages "${{ inputs.notion_pages }}" \
            --notion-source-id "${{ inputs.notion_source_id }}"

      - name: Create pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync."
            exit 0
          fi

          branch="automation/notion-sync-${{ inputs.algorithm }}-${{ inputs.week }}-${{ github.run_id }}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add algorithms
          git commit -m "Sync Notion paper reviews (${{ inputs.algorithm }} ${{ inputs.week }})"
          git push --set-upstream origin "$branch"

          gh pr create \
            --base "${{ inputs.target_branch }}" \
            --head "$branch" \
            --title "Sync Notion paper reviews: ${{ inputs.algorithm }} ${{ inputs.week }}" \
            --body "Notion 논문 리뷰 PDF와 README 요약을 자동 반영한 PR입니다."
